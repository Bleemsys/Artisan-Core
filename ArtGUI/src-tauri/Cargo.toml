[package]
name = "artisan-workbench"
version = "0.1.0"
description = "Artisan Workbench desktop application"
authors = ["Artisan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
