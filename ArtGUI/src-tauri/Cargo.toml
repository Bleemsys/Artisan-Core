[package]
name = "artisan-workbench"
version = "0.1.1"
description = "Artisan Workbench desktop application"
authors = ["Artisan"]
edition = "2021"

[[bin]]
name = "ArtGUI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdf5 = { package = "hdf5-metno", version = "0.14.1" }
ndarray = "0.15"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
