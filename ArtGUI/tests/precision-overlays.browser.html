<button id="language-toggle" translate="no">中文</button><h1 id="result">Running precision checks…</h1><div class="views"><div><h2>Morph controls</h2><div id="morph-viewport" class="viewport"><canvas></canvas></div></div><div><h2>Region controls</h2><div id="region-viewport" class="viewport"><canvas></canvas></div></div></div><pre id="checks"></pre>
<script type="module">
import * as THREE from '../ui/vendor/three.module.js';

const checks=[],assert=(v,name)=>{if(!v)throw Error(name);checks.push(name);},near=(a,b,t=1e-6)=>Math.abs(a-b)<t;
const flush=()=>new Promise(r=>setTimeout(r,0));
function makeViewer(id){const canvas=document.querySelector('#'+id+' canvas'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,620/420,.1,10000);camera.position.set(130,110,150);camera.lookAt(0,0,0);camera.updateMatrixWorld(true);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(620,420,false);renderer.setClearColor('#ffffff');const body=new THREE.Mesh(new THREE.BoxGeometry(16,16,16),new THREE.MeshNormalMaterial());scene.add(body);const v={scene,camera,canvas,renderer,origin:new THREE.Vector3(),controls:{enabled:true},layers:new Map(),section:{enabled:false},settings:{units:'mm'},fit(){},render(){v.overlay?.beforeRender();renderer.render(scene,camera);v.overlay?.afterRender();}};return v;}
function key(el,key,shiftKey=false){el.dispatchEvent(new KeyboardEvent('keydown',{key,shiftKey,bubbles:true,cancelable:true}));}
function capture(el){el.setPointerCapture=()=>{};el.hasPointerCapture=()=>false;el.releasePointerCapture=()=>{};}

function event(el,type,xy,id=1,shiftKey=false){el.dispatchEvent(new PointerEvent(type,{pointerId:id,button:0,clientX:xy[0],clientY:xy[1],bubbles:true,cancelable:true,shiftKey}));}
function screen(v,p){const r=v.canvas.getBoundingClientRect(),s=p.clone().sub(v.origin).project(v.camera);return [r.left+(s.x+1)*r.width/2,r.top+(1-s.y)*r.height/2];}
try{
 const mv=makeViewer('morph-viewport'),rv=makeViewer('region-viewport');let commits=0,cancels=0,lastOriginal=null;
 const p={...newMorph(),domain_mask:'Domain',fixed_mask:'Fixed',moving_regions:[newMotion('Save')]};
 const def=(id,c,size)=>({Define_ScalarField_CombineGeometry:{field_id:id,default_value:0,overlap:'Maximum',regions:[{geometry:{type:'Box',center:c,size},value:1,transition_width:0}]}});
 const workflow={'1':def('Domain',[0,0,0],[90,90,90]),'2':def('Fixed',[0,0,-30],[15,15,10]),'3':def('Save',[0,0,0],[24,24,24]),'4':{Proc_Field_Morph:p}};
 const mo=createMorphOverlay(mv,{onSelect(){},onDrag(r){p.moving_regions[0]=r;},onCommit(original){lastOriginal=original;commits++;},onCancel(original){p.moving_regions[0]=original;cancels++;},toast(message){throw Error(message);}});mv.overlay=mo;
 let mm='translate',ms=0;const updateM=()=>mo.update(p,workflow,'4',0,{mode:mm,snap:ms,showGuides:true});const mp=document.querySelector('#morph-viewport');updateM();
 assert(mp.querySelectorAll('.precision-move').length===6,'morph: six signed translation arrow grips');assert(mp.querySelectorAll('.precision-plane').length===3,'morph: three plane pads');
 key(mp.querySelector('[aria-label="Move -X"]'),'ArrowRight');assert(near(p.moving_regions[0].translation[0],-1),'morph: negative-axis keyboard direction');
 key(mp.querySelector('[aria-label="Move X"]'),'ArrowRight');assert(near(p.moving_regions[0].translation[0],0),'morph: positive-axis keyboard direction');
 key(mp.querySelector('[aria-label="Move in XY plane"]'),'ArrowRight');key(mp.querySelector('[aria-label="Move in XY plane"]'),'ArrowUp');assert(near(p.moving_regions[0].translation[0],1)&&near(p.moving_regions[0].translation[1],1)&&p.moving_regions[0].translation[2]===0,'morph: plane keyboard affects only its two axes');
 p.moving_regions[0]=newMotion('Save');ms=2;updateM();let pad=mp.querySelector('[aria-label="Move in XY plane"]'),start=coords(pad,mv.canvas);capture(pad);event(pad,'pointerdown',start);assert(mv.controls.enabled===false,'morph: dragging disables orbit controls');event(pad,'pointermove',[start[0]+20,start[1]-12]);event(pad,'pointerup',[start[0]+20,start[1]-12]);const t=p.moving_regions[0].translation;assert(t[2]===0&&t.slice(0,2).every(v=>near(v/2,Math.round(v/2)))&&Math.hypot(...t)>0,'morph: snapped plane pointer drag');assert(mv.controls.enabled===true,'morph: pointer up restores orbit controls');
 const before=JSON.stringify(p.moving_regions[0]);let b=mp.querySelector('[aria-label="Move X"]');start=coords(b,mv.canvas);capture(b);event(b,'pointerdown',start);event(b,'pointermove',[start[0]+18,start[1]+8]);key(document,'Escape');assert(JSON.stringify(p.moving_regions[0])===before&&mv.controls.enabled&&cancels===1,'morph: Escape restores original movement and camera');
 p.moving_regions[0]=newMotion('Save');mm='rotate';ms=0;updateM();const unchanged=JSON.stringify(p);mp.querySelector('[aria-label="Choose rotation axis X"]').click();assert(JSON.stringify(p)===unchanged,'morph: choosing a dial axis does not change workflow values');key(mp.querySelector('[aria-label="Rotate X"]'),'ArrowRight',true);assert(near(p.moving_regions[0].rotation_degrees,15)&&near(p.moving_regions[0].rotation_axis[0],1),'morph: Shift keyboard rotation snaps to 15 degrees');
 const qExpected=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/12).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),Math.PI/12));mp.querySelector('[aria-label="Choose rotation axis Z"]').click();key(mp.querySelector('[aria-label="Rotate Z"]'),'ArrowRight',true);const motion=p.moving_regions[0],actual=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(...motion.rotation_axis),motion.rotation_degrees*Math.PI/180);assert(actual.angleTo(qExpected)<1e-6,'morph: rotations compose in world coordinates');
 p.moving_regions[0]=newMotion('Save');updateM();const probe=createPrecisionGizmo(mv,{center:new THREE.Vector3(),mode:'rotate',axis:2,delta:0}),radius=probe.handles.find(h=>h.kind==='rotate').localPoint.length()*probe.group.scale.x,basis=precisionRotationBasis(2);const startPoint=basis.u.clone().multiplyScalar(radius),endPoint=basis.u.clone().multiplyScalar(radius*Math.cos(Math.PI/6)).addScaledVector(basis.v,radius*Math.sin(Math.PI/6));const a=screen(mv,startPoint),z=screen(mv,endPoint);capture(mv.canvas);event(mv.canvas,'pointerdown',a,9);assert(mv.controls.enabled===false,'morph: dial stroke can be grabbed directly on canvas');event(mv.canvas,'pointermove',z,9);event(mv.canvas,'pointerup',z,9);assert(near(p.moving_regions[0].rotation_degrees,30,1e-4)&&mv.controls.enabled,'morph: canvas dial drag applies the measured rotation');assert(mp.querySelector('.precision-readout').textContent.includes('30.0'),'morph: dial readout shows the operation delta');
 probe.group.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});
 let regions=[{name:'Save',geometry:{type:'Box',center:[0,0,0],size:[24,20,16]},value:1,transition_width:0}],regionCommits=0;
 const ro=createRegionOverlay(rv,{onSelect(){},onDrag(g){regions[0].geometry=g;},onCommit(original){lastOriginal=original;regionCommits++;},onCancel(original){regions[0].geometry=original;},toast(message){throw Error(message);}});rv.overlay=ro;const rp=document.querySelector('#region-viewport');let rm='move';const updateR=()=>ro.update(regions,0,{mode:rm,snap:0});updateR();
 assert(rp.querySelectorAll('.precision-move').length===6&&rp.querySelectorAll('.precision-plane').length===3,'region: uses the shared precision translation controls');key(rp.querySelector('[aria-label="Move in YZ plane"]'),'ArrowRight');key(rp.querySelector('[aria-label="Move in YZ plane"]'),'ArrowUp');assert(JSON.stringify(regions[0].geometry.center)==='[0,1,1]','region: plane keyboard changes only Y and Z');
 rm='rotate';updateR();const boxBefore=JSON.stringify(regions[0].geometry);rp.querySelector('[aria-label="Choose rotation axis X"]').click();assert(JSON.stringify(regions[0].geometry)===boxBefore,'region: dial axis selection preserves geometry');key(rp.querySelector('[aria-label="Rotate X"]'),'ArrowRight',true);assert(near(regions[0].geometry.rotation_degrees,15)&&near(regions[0].geometry.rotation_axis[0],1),'region: Box supports precision keyboard rotation');
 regions[0].geometry={type:'Cylinder',center:[0,0,0],axis:[0,0,1],height:24,radius:10};updateR();rp.querySelector('[aria-label="Choose rotation axis X"]').click();key(rp.querySelector('[aria-label="Rotate X"]'),'ArrowRight',true);assert(near(regions[0].geometry.axis[1],-Math.sin(Math.PI/12))&&near(regions[0].geometry.axis[2],Math.cos(Math.PI/12))&&regions[0].geometry.radius===10&&regions[0].geometry.height===24,'region: Cylinder rotation preserves radius and height');
 regions[0].geometry={type:'Sphere',center:[0,0,0],radius:10};rm='move';updateR();assert(rp.querySelectorAll('.precision-move').length===6,'region: Sphere uses precision translation');rm='resize';updateR();key(rp.querySelector('[aria-label="Radius"]'),'ArrowRight');assert(near(regions[0].geometry.radius,11),'region: radius resizing remains functional');
 regions[0].geometry={type:'Box',center:[0,0,0],size:[24,20,16],rotation_axis:[0,0,1],rotation_degrees:35};updateR();const beforeBox=cloneNumericJson(regions[0].geometry),axis=new THREE.Vector3(...boxAxes(beforeBox)[0]),fixedFace=new THREE.Vector3(...beforeBox.center).addScaledVector(axis,-beforeBox.size[0]/2);key(rp.querySelector('[aria-label="X + face"]'),'ArrowRight');const afterBox=regions[0].geometry,afterFace=new THREE.Vector3(...afterBox.center).addScaledVector(axis,-afterBox.size[0]/2);assert(fixedFace.distanceTo(afterFace)<1e-6,'region: rotated Box resize preserves the opposite face');
 rm='move';updateR();assert(commits>0&&regionCommits>0&&lastOriginal,'both editors emit original-state commits for Undo');
 initLanguage();setLanguage('zh-CN');await flush();assert(mp.querySelector('.precision-axis-selector').getAttribute('aria-label').startsWith('选择旋转操作轴'),'precision axis controls translate to Chinese');assert(rp.querySelector('.precision-plane').getAttribute('aria-label').includes('平面内移动'),'precision plane controls translate to Chinese');assert(mp.querySelector('.morph-legend').textContent.includes('精确旋转'),'precision help translates to Chinese');assert(mp.querySelector('.precision-readout').getAttribute('aria-label')==='旋转变化量','precision readout accessibility label translates to Chinese');assert(rp.querySelector('.precision-pivot-handle').title.startsWith('拖动中心点'),'region pivot tooltip translates without translating the region name');
 document.querySelector('#result').textContent='PASS: '+checks.length+' precision interaction checks';document.querySelector('#result').dataset.status='pass';document.querySelector('#checks').textContent=checks.join('\n');
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;document.querySelector('#result').dataset.status='fail';document.querySelector('#checks').textContent=checks.join('\n');console.error(e);}
</script>
