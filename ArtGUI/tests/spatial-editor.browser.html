<style>body{display:block;padding:20px;background:#f6f8fb;font:14px 'Segoe UI',sans-serif}h1{font-size:19px}.test-layout{display:flex;gap:18px;align-items:start}.viewport{position:relative;width:700px;height:520px;background:white;border:1px solid #ddd}canvas{display:block;width:700px;height:520px}#panel{width:350px;background:white;padding:16px;max-height:660px;overflow:auto}pre{white-space:pre-wrap}.region-legend{font-size:12px}button{cursor:pointer}</style>
<button id="language-toggle">中文</button><h1 id="result">Running checks…</h1><div class="test-layout"><div class="viewport"><canvas></canvas></div><div id="panel"></div></div><pre id="checks"></pre>
<script type="module">
import * as T from '../ui/vendor/three.module.js';

const checks=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push(s);},near=(a,b)=>Math.abs(a-b)<1e-6,flush=()=>new Promise(r=>setTimeout(r,0));
const canvas=document.querySelector('canvas'),scene=new T.Scene(),camera=new T.PerspectiveCamera(42,700/520,.1,10000);camera.position.set(130,110,150);camera.lookAt(0,0,0);camera.updateMatrixWorld(true);const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setSize(700,520,false);renderer.setClearColor('#fff');
const source=new T.Mesh(new T.BoxGeometry(24,18,30),new T.MeshNormalMaterial());source.position.set(10,0,0);scene.add(source);const sourceBox=new T.Box3(new T.Vector3(-2,-9,-15),new T.Vector3(22,9,15));
const viewer={canvas,scene,camera,renderer,layers:new Map([['part',{path:'part.stl',mesh:source,box:sourceBox}]]),origin:new T.Vector3(),settings:{units:'mm'},section:{enabled:false},controls:{enabled:true},fit(){this.render();},render(){this.overlay?.beforeRender();renderer.render(scene,camera);this.overlay?.afterRender();}};

function key(label,key='ArrowRight',shiftKey=false){const el=viewport.querySelector(`[aria-label="${label}"]`);if(!el)throw Error('Missing '+label);el.dispatchEvent(new KeyboardEvent('keydown',{key,shiftKey,bubbles:true,cancelable:true}));}

function event(el,type,p,id){el.dispatchEvent(new PointerEvent(type,{pointerId:id,button:0,clientX:p[0],clientY:p[1],bubbles:true,cancelable:true}));}
const box=(x=0)=>({ori:[x,0,0],normal:[0,0,1],length:[12,10,8],z_angle:.3});

 for(const k of ['Add_Geometry','Subtract_Geometry','Intersect_Geometry']){
  open(k,{Name:'Box',Paras:box(),k_factor:.8,custom:'keep'});const before=stringifyNumericJson(params);assert(viewport.querySelectorAll('.precision-move').length===6,k+': signed translation arrows');click('[data-spatial-tool="rotate"]');assert(viewport.querySelector('.precision-readout'),k+': ticked rotation dial');assert(stringifyNumericJson(params)===before,k+': choosing tools preserves JSON');key('Rotate Z','ArrowRight',true);assert(near(params.Paras.z_angle,.3+Math.PI/12),k+': degree dial writes radians');click('[data-spatial-undo]');assert(stringifyNumericJson(params)===before,k+': Undo restores exact numeric JSON');click('[data-spatial-tool="move"]');key('Move in XY plane');assert(near(params.Paras.ori[0],1)&&params.Paras.ori[1]===0,k+': plane movement updates ori');
 }
 open('Subtract_Geometry',{Name:'Sphere',Paras:{ori:[0,0,0],r:15},k_factor:.1});assert(!host.querySelector('[data-spatial-tool="rotate"]'),'sphere: hides irrelevant rotation tool');click('[data-spatial-tool="resize"]');key('Radius');assert(params.Paras.r===16,'sphere: radius handle writes r');
 open('Intersect_Geometry',{Name:'Cylinder',Paras:{pa:[0,0,-10],pb:[0,0,10],r:5}});click('[data-spatial-tool="rotate"]');viewport.querySelector('[aria-label="Choose rotation axis X"]').click();key('Rotate X','ArrowRight',true);assert(near(params.Paras.pb[1],-10*Math.sin(Math.PI/12)),'cylinder: rotation moves endpoints');
 open('Proc_BoxSlices',{Source:'Geometry',Target:'FieldContainer',Boxes:[{FieldID:'Save',...box()},{FieldID:'B',...box(30)}]});click('[data-slice-select="slice:1"]');key('Move X');assert(params.Boxes[0].ori[0]===0&&params.Boxes[1].ori[0]===31,'slices: selected box moves independently');change('[data-spatial-number="size.2"]','20');assert(params.Boxes[1].length[2]===10,'slices: full dimension input writes half length');assert(params.Boxes[1].FieldID==='B'&&params.Target==='FieldContainer','slices: IDs and export target preserved');click('[data-spatial-duplicate]');assert(params.Boxes.length===3&&params.Boxes[2].FieldID==='Slice3','slices: duplicate allocates a unique ID');click('[data-spatial-remove]');assert(params.Boxes.length===2,'slices: remove selected box');click('[data-spatial-undo]');assert(params.Boxes.length===3,'slices: removal can be undone');click('[data-spatial-add]');assert(params.Boxes[3].FieldID==='Slice4','slices: add avoids existing IDs');
 open('HS_Interpolate',{pt:[0,0,0],n_vec:[0,0,2],Rot:[.2,.3,.4],Trans:[1,2,3],la_name:'Cubic'});assert(host.querySelectorAll('[data-spatial-tool]').length===2,'plane: move and rotate only');click('[data-spatial-tool="rotate"]');viewport.querySelector('[aria-label="Choose rotation axis X"]').click();key('Rotate X','ArrowRight',true);assert(near(params.n_vec[1],-2*Math.sin(Math.PI/12)),'plane: rotation writes its normal');assert(JSON.stringify(params.Rot)==='[0.2,0.3,0.4]'&&JSON.stringify(params.Trans)==='[1,2,3]','plane: lattice placement preserved');change('[data-spatial-number="normal.0"]','1');assert(params.n_vec[0]>0,'plane: numeric normal edits refresh the guide');
 open('Lin_Interpolate',{pt_01:[0,0,-20],n_vec_01:[0,0,1],pt_02:[0,0,20],n_vec_02:[0,0,-1],thk:.4});assert(host.querySelectorAll('[data-spatial-target] option').length===2,'linear transition: two selectable planes');change('[data-spatial-target]','plane:2');key('Move Z');assert(params.pt_01[2]===-20&&params.pt_02[2]===21,'linear transition: only selected plane moves');assert(viewport.querySelectorAll('.precision-plane').length===3,'linear transition: plane pads available');
 open('Add_Attractor',{pt:[0,0,0],r:20,Rot:[.1,.2,.3],Trans:[1,2,3],thk:.5});key('Move Y');click('[data-spatial-tool="resize"]');key('Radius');assert(params.pt[1]===1&&params.r===21,'attractor: center and radius handles update pt/r');assert(params.thk===.5&&JSON.stringify(params.Trans)==='[1,2,3]','attractor: lattice settings preserved');
 click('[data-spatial-tool="move"]');change('[data-spatial-snap]','2');const original=stringifyNumericJson(params),pad=viewport.querySelector('[aria-label="Move in XY plane"]'),r=canvas.getBoundingClientRect(),a=[r.left+parseFloat(pad.style.left),r.top+parseFloat(pad.style.top)];capture(pad);event(pad,'pointerdown',a,13);event(pad,'pointermove',[a[0]+43,a[1]+12],13);assert(!viewer.controls.enabled,'drag: orbit disabled while editing');assert(stringifyNumericJson(params)!==original,'drag: live parameters updated');document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(stringifyNumericJson(params)===original&&viewer.controls.enabled,'drag: Escape restores exact state and orbit');
 open('Add_Geometry',{Name:'part.stl',Paras:{Scale:[1,1,1],Trans:[0,0,0],Rot:[0,0,0]},k_factor:0});const sourceBefore=source.matrixWorld.clone(),positionBefore=source.position.clone(),geometryBefore=source.geometry;assert(viewport.querySelectorAll('.precision-move').length===6,'mesh: loaded source enables Precision handles');key('Move X');assert(near(params.Paras.Trans[0],1),'mesh: translation maps to Trans');click('[data-spatial-tool="rotate"]');viewport.querySelector('[aria-label="Choose rotation axis Z"]').click();key('Rotate Z','ArrowRight',true);assert(near(params.Paras.Rot[2],Math.PI/12),'mesh: rotation maps to radians XYZ');click('[data-spatial-tool="resize"]');change('[data-spatial-number="size.0"]','48');assert(near(params.Paras.Scale[0],2),'mesh: full dimensions map to Scale');assert(source.position.equals(positionBefore)&&source.geometry===geometryBefore,'mesh: source layer and buffers remain unchanged');
 open('Subtract_Geometry',{Source:{Type:'Field',ID:'Save'},custom:9,k_factor:.7});const refBefore=stringifyNumericJson(params);assert(!host.querySelector('[data-spatial-tool]'),'field reference: no unsupported transform handles');assert(stringifyNumericJson(params)===refBefore,'field reference: opening panel preserves source');click('[data-spatial-shape="Box"]');assert(!params.Source&&params.Name==='Box'&&params.custom===9,'field reference: explicit shape choice preserves other options');click('[data-spatial-undo]');assert(stringifyNumericJson(params)===refBefore,'field reference: shape replacement can be undone');
 open('Proc_BoxSlices',{Source:'Geometry',Target:'FieldContainer',Boxes:[{FieldID:'Save',...box()}]});assert(host.querySelector('[data-spatial-remove]').disabled,'slices: cannot remove the final box');initLanguage();setLanguage('zh-CN');await flush();assert(host.querySelector('h3').textContent==='长方体切片','Chinese: Precision section translated');assert(host.querySelector('[data-spatial-number="size.0"]').getAttribute('aria-label')==='宽度','Chinese: dimension accessibility labels translated');assert(host.querySelector('[data-slice-select] strong').textContent==='Save','Chinese: user field IDs preserved');assert(viewport.querySelector('.precision-plane').getAttribute('aria-label').includes('平面内移动'),'Chinese: shared handles translated');setLanguage('en');await flush();assert(host.querySelector('h3').textContent==='Slice boxes','language switch: English restored');assert(params.Boxes[0].FieldID==='Save','language switch: JSON unchanged');

 open('Proc_BoxSlices',{Source:'Geometry',Target:'FieldContainer',Boxes:[{FieldID:'A',...box()}]});
 change('[data-spatial-number="size.0"]','40');assert(params.Boxes[0].length[0]===20,'slice manager: width writes half length');
 change('[data-slice-name]','NamedSlice');assert(params.Boxes[0].FieldID==='NamedSlice','slice manager: rename writes FieldID');
 click('[data-slice-plane="YZ"]');change('[data-slice-offset]','25');assert(near(params.Boxes[0].ori[0],25),'slice manager: offset follows rotated normal');
 const beforeSet=stringifyNumericJson(params);click('[data-slice-parallel]');change('#slice-count','3');change('#slice-spacing','10');click('[data-slice-create]');
 assert(params.Boxes.length===4,'parallel set: appends three boxes');
 assert(params.Boxes.slice(1).every((b,i)=>near(b.ori[0],15+i*10)),'parallel set: centers spaced symmetrically along rotated normal');
 assert(new Set(params.Boxes.map(b=>b.FieldID)).size===4,'parallel set: unique IDs');
 click('[data-spatial-undo]');assert(stringifyNumericJson(params)===beforeSet,'parallel set: single Undo restores original');
 click('[data-slice-parallel]');change('#slice-count','2.5');const beforeInvalid=stringifyNumericJson(params);click('[data-slice-create]');assert(stringifyNumericJson(params)===beforeInvalid&&messages.pop().includes('integer'),'parallel set: invalid count leaves workflow unchanged');

 open('Proc_BoxSlices',{Source:'Geometry',outfile:'slice.stl',Boxes:[box()]});click('[data-spatial-duplicate]');assert(params.Boxes.every(b=>!('FieldID' in b))&&!('Target' in params),'legacy file output: duplicate preserves schema');

 open('Proc_BoxSlices',{Source:'Geometry',Boxes:[box(),box(30)]});change('[data-slice-output]','FieldContainer');assert(params.Boxes.every(b=>b.FieldID)&&params.Target==='FieldContainer','output switch: assigns required unique field IDs');
 assert(!host.textContent.includes('Advanced settings'),'slice manager: no empty advanced section');

 open('Proc_BoxSlices',{Source:'Geometry',Target:'FieldContainer',Boxes:[{FieldID:'A',...box()},{FieldID:'B',...box(30)},{FieldID:'C',...box(60)}]});
 const visibilityBefore=stringifyNumericJson(params),changesBefore=changes;
 click('[data-slice-visible="0"]');assert(!viewport.querySelector('[aria-label="Move X"]'),'visibility: hiding selected slice also hides its editing handles');
 assert(stringifyNumericJson(params)===visibilityBefore&&changes===changesBefore,'visibility: outline switch does not change workflow or dirty state');

 assert(host.querySelector('.region-heading h3 span').textContent==='3','list: heading shows slice count');
 assert(host.querySelectorAll('.region-list .region-row .region-select').length===3,'list: uses shared scalar-region row components');
 assert(changes>0&&messages.length===0,'all edits complete without interaction errors');
 document.querySelector('#result').textContent='PASS: '+checks.length+' spatial-panel checks';document.querySelector('#result').dataset.status='pass';document.querySelector('#checks').textContent=checks.join('\n');
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;document.querySelector('#result').dataset.status='fail';document.querySelector('#checks').textContent=checks.join('\n');console.error(e);}
